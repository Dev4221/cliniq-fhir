<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 320px;
    background: linear-gradient(135deg, #0D1318 0%, #18232F 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 56px;
  }
  .accent-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #1D9E75, #378ADD);
  }
  .grid-h { position: absolute; left: 0; right: 0; height: 0.5px; background: rgba(255,255,255,0.04); }
  .grid-v { position: absolute; top: 0; bottom: 0; width: 0.5px; background: rgba(255,255,255,0.04); }
  .left { display: flex; flex-direction: column; justify-content: center; max-width: 540px; }
  .icon-wrap {
    width: 52px; height: 52px; border-radius: 12px;
    background: rgba(29,158,117,0.15);
    border: 1px solid rgba(29,158,117,0.4);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .icon-wrap svg { width: 26px; height: 26px; }
  h1 {
    font-size: 50px; font-weight: 600;
    color: #E8E4DC; letter-spacing: -1.5px;
    line-height: 1; margin-bottom: 8px;
  }
  .sub {
    font-size: 16px; color: #8A9BAB;
    font-weight: 400; margin-bottom: 16px;
  }
  .divider {
    width: 100%; height: 0.5px;
    background: #2A3848; margin-bottom: 14px;
  }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 4px 10px;
    border-radius: 4px; font-weight: 500;
  }
  .tag-teal { background: rgba(29,158,117,0.15); color: #3DC99A; border: 0.5px solid rgba(29,158,117,0.4); }
  .tag-blue { background: rgba(55,138,221,0.15); color: #7AB3E8; border: 0.5px solid rgba(55,138,221,0.4); }
  .tag-purple { background: rgba(127,119,221,0.15); color: #9B94E8; border: 0.5px solid rgba(127,119,221,0.4); }
  .tag-amber { background: rgba(186,117,23,0.15); color: #ECA83A; border: 0.5px solid rgba(186,117,23,0.4); }
  .tag-coral { background: rgba(216,90,48,0.15); color: #E87060; border: 0.5px solid rgba(216,90,48,0.4); }
  .right {
    display: flex; gap: 12px; align-items: center;
    flex-shrink: 0;
  }
  .stat-card {
    width: 148px; padding: 20px 16px;
    background: rgba(255,255,255,0.04);
    border: 0.5px solid #2A3848;
    border-radius: 10px; text-align: center;
  }
  .stat-val {
    font-size: 34px; font-weight: 600;
    line-height: 1; margin-bottom: 7px;
  }
  .stat-label { font-size: 11px; color: #8A9BAB; margin-bottom: 4px; }
  .stat-sub { font-size: 10px; }
  .bottom {
    position: absolute; bottom: 14px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: #4A5C6A;
  }
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="grid-h" style="top:80px"></div>
  <div class="grid-h" style="top:160px"></div>
  <div class="grid-h" style="top:240px"></div>
  <div class="grid-v" style="left:320px"></div>
  <div class="grid-v" style="left:640px"></div>
  <div class="grid-v" style="left:960px"></div>

  <div class="left">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1D9E75" stroke-width="1.5">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
    </div>
    <h1>ClinIQ</h1>
    <div class="sub">Clinical Operations Dashboard</div>
    <div class="divider"></div>
    <div class="tags">
      <span class="tag tag-teal">FHIR R4</span>
      <span class="tag tag-blue">Claude</span>
      <span class="tag tag-purple">Power BI</span>
      <span class="tag tag-amber">ChromaDB</span>
      <span class="tag tag-coral">FastAPI</span>
    </div>
  </div>

  <div class="right">
    <div class="stat-card">
      <div class="stat-val" style="color:#3DC99A">500</div>
      <div class="stat-label">patients</div>
      <div class="stat-sub" style="color:#3DC99A">live FHIR R4</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#7AB3E8">78K</div>
      <div class="stat-label">observations</div>
      <div class="stat-sub" style="color:#7AB3E8">labs and vitals</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#ECA83A">15K</div>
      <div class="stat-label">encounters</div>
      <div class="stat-sub" style="color:#ECA83A">inpatient and outpatient</div>
    </div>
  </div>

  <div class="bottom">Built by Devansh Bhuta · github.com/Dev4221/cliniq-fhir</div>
</body>
</html>
